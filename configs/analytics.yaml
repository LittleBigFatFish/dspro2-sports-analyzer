# Thresholds for sports_analyzer.analytics; times are seconds, turned into frames with each source's fps.
pitch:
  # Metres from the ball; the SkillCorner audit rule at 10 fps (1.5 m, 3 frames hold, 50 frames gap).
  radius: 1.5
  max_z: null
  hold: 0.3
  max_gap: 5.0
  ball_gap: 0.5
image:
  # Player box heights from the feet point to the ball centre.
  radius: 0.5
  hold: 0.3
  max_gap: 5.0
  ball_gap: 0.5
goal:
  # Pitch: ball beyond the goal line, |y| <= post and z <= bar in metres; image: ball centre in the goal polygon.
  length: 105.0
  post: 3.66
  bar: 2.44
  min_duration: 0.0
skillcorner:
  # The 20 open-data matches by kick-off date: the first 12 tune the rule, the last 8 are held out.
  tune: [1874553, 1886347, 1899585, 1925299, 1927964, 1953632, 1959846, 1986691, 1996436, 1996435, 2006229, 2006363]
  test: [2007448, 2007721, 2010085, 2011166, 2013725, 2015213, 2016236, 2017461]
  # A found pass matches a provider pass within this many seconds, one to one; strict also needs the same players.
  tolerance: 1.0
  chance_seeds: [0, 1, 2, 3, 4]
  # Chosen by strict pass F1 on the tune matches only; the default rule is the pitch block above.
  grid:
    radius: [1.0, 1.5, 2.0, 3.0, 4.0]
    hold: [0.1, 0.3, 0.5, 0.8, 1.2]
    max_z: [null, 1.0, 2.0]
    ball_gap: [0.0, 1.0]
  # Passer possession start types that are restarts taken by the passer.
  set_pieces: [throw_in_reception, free_kick_reception, goal_kick_reception, corner_reception]
  # Seconds around the end frame of the flagged possession in which a goal-mouth event must start.
  goal_window: [-1.0, 5.0]
  false_alarm_sample: 20
  # Ball track degraded like a detector: misses in runs of mean `run` seconds down to `recall`, then false balls
  # at random pitch positions in `false_rate` of the in-play frames; held-out matches, tuned rule.
  degrade:
    recall: [1.0, 0.9, 0.7, 0.5, 0.3]
    run: [0.3, 1.5]
    false_rate: [0.0, 0.05, 0.2]
    ball_gaps: [0.0, 1.0]
    seed: 0
